application:
  subdomain: netbootxyz
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://netbootxyz.cloud.lazycat.app.netbootxyz.lzcapp:3000/
  ingress:
    - protocol: udp
      port: 69
      service: netbootxyz

services:
  netbootxyz:
    # upstream: linuxserver/netbootxyz:version-0.7.6
    image: docker.1ms.run/linuxserver/netbootxyz:version-0.7.6
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MENU_VERSION=1.9.9
      - PORT_RANGE=30000:30010
      - SUBFOLDER=/
      - NGINX_PORT=80
      - WEB_APP_PORT=3000
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/var/ISOs:/assets
